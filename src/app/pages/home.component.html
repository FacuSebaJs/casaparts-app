<div class="container">
  <h2>Bienvenido a CasaParts</h2>

  <!-- 🛒 Ícono de carrito fijo -->
  <div
    style="position: fixed; top: 10px; right: 10px; z-index: 1000; background-color: yellow; padding: 5px; border-radius: 8px; cursor: pointer;"
    (click)="irAlCarrito()">
    <img src="assets/images/CarritoCompras.png" alt="Carrito" width="36" height="36" />
    <span *ngIf="cartLength > 0"
      style="position: absolute; top: -5px; right: -5px; background-color: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px;">
      {{ cartLength }}
    </span>
  </div>

  <!-- 🔍 Buscador -->
  <div class="buscador">
    <input [(ngModel)]="busqueda" placeholder="Buscar producto..." />
    <button type="button" (click)="buscar()">🔍</button>
  </div>

  <!-- Estados -->
  <div *ngIf="cargandoProductos" class="text-muted mt-2">Buscando productos...</div>
  <div *ngIf="errorProductos" class="text-danger mt-2">{{ errorProductos }}</div>
  <div [hidden]="!spinner" class="spinner-border spinner-border-sm" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>

  <!-- 🏷️ Carrusel de resultados -->
  <ng-container>
    <div #carouselOfertas id="carouselOfertas" class="carousel slide mb-4"
      data-bs-ride="carousel" data-bs-interval="3000">
      <div class="carousel-inner" style="width: 100%; height: auto;">

        <div *ngFor="let articulo of articulos; let i = index; trackBy: trackByIndex"
             class="carousel-item text-center"
             [class.active]="i === 0">

          <!-- Imagen -->
          <img *ngIf="!imagenes[i]" src="assets/images/not_found.png"
               class="d-block mx-auto"
               [alt]="articulo?.DESCRIP || 'Imagen no disponible'"
               style="width: 100%; height: 100%;" />
          <img *ngIf="imagenes[i]" [src]="imagenes[i]"
               class="d-block mx-auto"
               [alt]="articulo?.DESCRIP || 'Imagen del producto'"
               style="width: 100%; height: auto;" />

          <!-- Título / descripción principal -->
          <p class="mt-2 mb-1">
            <strong>{{ articulo.DESCRIP }}</strong>
          </p>

          <!-- 🔹 Datos técnicos -->
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Marca:</span>
            <span class="fw-semibold">{{ articulo.MARCA }}</span>
          </div>
          <div class="small text-start mx-auto" style="max-width: 560px;">
            <div class="d-flex justify-content-between">
              <span class="text-muted">Código:</span>
              <span class="fw-semibold">{{ articulo.CODIGO }}</span>
            </div>
            <div class="d-flex justify-content-between">
              <span class="text-muted">N° Pieza original:</span>
              <span class="fw-semibold">{{ articulo.ORIGINAL }}</span>
            </div>
          </div>

          <!-- 🔘 Acciones por producto -->
          <div class="mt-3 d-flex justify-content-center gap-2">
            <button class="btn btn-primary" type="button" (click)="agregarAlCarrito(articulo)">
              Agregar al carrito
            </button>
            <button class="btn btn-dark" type="button" (click)="irAlCarrito()">
              Ver pedido
            </button>
          </div>
          <!-- 🔹 Fin datos técnicos -->
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselOfertas" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselOfertas" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </ng-container>

  <!-- 📦 Botón global para ir al resumen del carrito -->
  <button class="btn btn-dark w-100 mt-4" type="button" (click)="irAlCarrito()">Ver pedido</button>
</div>
